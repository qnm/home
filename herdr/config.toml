# Symlinked to ~/.config/herdr/config.toml by herdr.nix. herdr writes to this
# file itself (onboarding state, anything changed from its UI), so it is a
# plain file here rather than a generated store path — its writes land in this
# repo and show up in `git diff`.

[theme]
# herdr isn't covered by catppuccin/nix, so the flavor is set here rather than
# following the global `catppuccin.flavor` in home.nix.
#
# auto_switch stays off. Under herdr 0.9.1 in Ghostty it resolved the terminal
# appearance to something that wasn't mocha and `name` never applied, which
# read as the theme being lost entirely. With it off, light_name and dark_name
# are inert.
name = "catppuccin"
auto_switch = false
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[ui]
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
# Put each agent's own session name in its sidebar row. The default rows are
# [["state_icon", "workspace", "tab"], ["agent"]], so every pane in a repo
# reads as the workspace label ("amber-core") — the session name is carried in
# the terminal_title_stripped token, which the default layout leaves out.
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.sidebar.spaces]
# Name the worktree each Space is really working in. herdr's built-in `branch`
# token resolves the directory the workspace was *created* in and never
# revisits it, so a werk card reads "main" forever: werk starts a card in the
# main repo when it has no worktree yet, and the agent typically creates one
# minutes later. `$worktree` is display metadata werk reports on every refresh
# (mux/herdr.py describe()), so the row becomes "main · aio-242". Spaces with
# no such metadata are unchanged — herdr drops a token that has no value.
rows = [["state_icon", "workspace"], ["branch", "$worktree", "git_status"]]

[ui.toast]
# Background notifications go to the macOS notifier rather than herdr's own
# in-terminal toast, so `ui.toast.herdr.position` doesn't apply.
delivery = "system"
delay_seconds = 1

[experimental]
kitty_graphics = true
